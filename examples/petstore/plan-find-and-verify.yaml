metadata:
  created: 2026-02-11T12:00:00Z
  prompt: "Create a pet, find it by status, then verify and clean up"
  graphVersion: "1.0.0"

intent:
  goal: getPet
  description: "Create a pet, find it in the status listing, retrieve it by ID, then delete it"

execution:
  steps:
    - node: createPet
      description: "Create a new pet named Bella"
      values:
        name: "Bella"
        status: "available"
      assertions:
        mechanical:
          - type: status
            expect: 200
          - type: fieldExists
            path: "id"

    - node: findByStatus
      dependsOn: [createPet]
      description: "Find all available pets"
      values:
        status: "available"
      assertions:
        mechanical:
          - type: status
            expect: 200

    - node: getPet
      dependsOn: [findByStatus]
      isGoal: true
      description: "Retrieve the first pet from the list by ID"
      selections:
        pet:
          from: findByStatus.pets
          strategy: first
      values:
        petId:
          fromSelection: pet.petId
      assertions:
        mechanical:
          - type: status
            expect: 200
          - type: fieldExists
            path: "name"

    - node: deletePet
      dependsOn: [createPet]
      description: "Clean up: delete the pet we created"
      assertions:
        mechanical:
          - type: status
            expect: 200
