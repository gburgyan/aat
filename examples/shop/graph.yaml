version: "1.0.0"
title: AAT Shop
description: >-
  The offline e-commerce API served by aat-sandbox. Catalog, carts, orders, and shipments are on the
  shop API (http://localhost:8765/{region}/v1), which requires an OAuth2 bearer token from
  POST /oauth/token. Charges and refunds are on a separately hosted payments API
  (http://localhost:8766/{region}/v1), which requires the X-API-Key header instead of the token.
  The region in the base URL (us or eu) sets currency, prices, tax, and shipping tiers. Errors use
  one envelope, {"error": {"code": "...", "message": "..."}}, with stable codes; the domain concepts
  describe them and the rules behind them.

# Contract for static checks (aat validate) and runtime validation (--oas-validate).
oas: openapi.yaml

nodes:
  # --- Catalog -------------------------------------------------------------

  listProducts:
    description: >-
      List the catalog with region prices (GET /products). The catalog is always the same six SKUs,
      priced in minor units of the region's currency; SKU-1005 is always out of stock. The first
      call of every purchase: pick the products to buy from the entries whose inStock is true.
    adapter: listProducts
    tags: [catalog]
    oas:
      operationId: listProducts
    inputs:
      - name: category
        type: enum[gear, apparel, footwear]
        description: Only list products in this category (query parameter); omit it for the whole catalog
        optional: true
    outputs:
      - name: currency
        type: string
        description: USD in us, EUR in eu; every price in the response is in this currency
      - name: products
        type: product[]
        description: >-
          Catalog entries with sku, name, category, price (minor units), priceDisplay, and inStock.
          Only add products whose inStock is true; SKU-1005 never is.
        elementFields:
          - name: sku
            type: string
          - name: name
            type: string
          - name: category
            type: string
          - name: price
            type: integer
          - name: inStock
            type: boolean
      - name: rateLimitLimit
        type: integer
        description: Requests the bearer token may make per minute, read from the RateLimit-Limit response header
      - name: rateLimitRemaining
        type: integer
        description: >-
          Requests the token has left this minute, read from the RateLimit-Remaining response header. The
          sandbox counts requests but never refuses one.
    satisfies: [catalogBrowsed]

  checkInventory:
    description: >-
      Read the stock of one SKU (GET /inventory/{sku}). An unknown SKU is 404 NOT_FOUND; a known one
      always answers 200: status OK with the available units, or status ERROR with errorCode and
      errorMessage when the read failed (available is then 0). The first read of SKU-1004 with each
      bearer token in each region is a stale ERROR (STALE_READ) that a retry clears. Optional in a
      purchase, since addItem checks stock itself.
    adapter: checkInventory
    tags: [catalog]
    oas:
      operationId: checkInventory
    inputs:
      - name: sku
        type: string
        description: Product SKU, as listed by listProducts
        default: SKU-1004
    outputs:
      - name: status
        type: string
        description: OK, or ERROR when the read failed; check it before trusting available
      - name: sku
        type: string
        description: The SKU that was read
      - name: available
        type: integer
        description: Units in stock when status is OK; 0 when status is ERROR
    # The API reports this failure inside a 200 response; surface it as a
    # response_error so retry rules can act on it.
    errorDetection:
      - path: status
        rule: equals
        value: ERROR
        details:
          code: errorCode
          message: errorMessage
    requires: [catalogBrowsed]

  # --- Carts ---------------------------------------------------------------

  createCart:
    description: >-
      Open an empty cart (POST /carts, 201). Every purchase starts here: the cartId feeds addItem,
      getCart, applyCoupon, and checkoutCart. A customerEmail makes it a registered customer's
      cart; one without an @ is 400 VALIDATION_ERROR.
    adapter: createCart
    tags: [carts]
    oas:
      operationId: createCart
    inputs:
      - name: customerEmail
        type: string
        description: Registered customer's email; omit it, or send an empty body, for a guest cart
        optional: true
    outputs:
      - name: cartId
        type: string
        description: Cart ID, such as cart_0001, used by every later cart call
      - name: status
        type: string
        description: open until checkoutCart turns the cart into an order
    cleanup: deleteCart
    satisfies: [cartOpen]

  addItem:
    description: >-
      Add a product to an open cart (POST /carts/{cartId}/items, 201) and return the whole cart.
      Call it once per product; adding a SKU that is already in the cart adds to its quantity.
      Checks run in this order: 400 VALIDATION_ERROR (missing sku, quantity below 1, missing or
      malformed JSON body), 404 NOT_FOUND (cart), 409 CART_NOT_OPEN (already checked out),
      404 NOT_FOUND (SKU), 409 OUT_OF_STOCK (out of stock, or the cart would hold more of the SKU
      than is in stock).
    adapter: addItem
    tags: [carts]
    oas:
      operationId: addItem
    inputs:
      - name: cartId
        type: string
        description: Cart from createCart
        default:
          from: createCart.cartId
      - name: sku
        type: string
        description: SKU to add; defaults to the first product listProducts reports as inStock
        default:
          from: listProducts.products
          select:
            strategy: match
            field: sku
            filter: inStock == true
      - name: quantity
        type: integer
        description: >-
          Units to add, required and at least 1 (400 VALIDATION_ERROR otherwise); the cart's total for
          this SKU may not exceed its stock
        default: 1
    outputs:
      - name: cartId
        type: string
        description: The cart the item was added to
      - name: lineCount
        type: integer
        description: Number of distinct SKUs now in the cart
      - name: subtotal
        type: integer
        description: Cart subtotal in minor units, before discount, shipping, and tax
    requires: [cartOpen]
    satisfies: [cartPopulated]

  getCart:
    description: >-
      Read a cart (GET /carts/{cartId}); an unknown cart is 404 NOT_FOUND. The API returns lines as
      sku and quantity only, with names and prices in a separate products array; the template's Lua
      transform joins them into each line. Useful for showing the cart before checkout.
    adapter: getCart
    tags: [carts]
    oas:
      operationId: getCart
    inputs:
      - name: cartId
        type: string
        description: Cart from createCart
        default:
          from: createCart.cartId
    outputs:
      - name: cartId
        type: string
        description: The cart that was read
      - name: status
        type: string
        description: open, or no longer open once checkoutCart has turned the cart into an order
      - name: lineCount
        type: integer
        description: Number of distinct SKUs in the cart
      - name: subtotal
        type: integer
        description: Minor units, before discount, shipping, and tax
      - name: subtotalDisplay
        type: string
        description: The subtotal formatted for display, such as $98.97
      - name: lines
        type: cartLine[]
        description: Cart lines joined with product name and unit price
        elementFields:
          - name: sku
            type: string
          - name: quantity
            type: integer
          - name: name
            type: string
          - name: price
            type: integer
    requires: [cartOpen]

  applyCoupon:
    description: >-
      Apply a coupon to an open cart (POST /carts/{cartId}/coupon, 200). A cart holds one coupon;
      applying another replaces it. SAVE10 takes 10% off the subtotal and FREESHIP makes shipping
      free in every region; EU-ONLY takes 10% off in eu only. Errors, in the order they are checked:
      400 VALIDATION_ERROR (code missing or a malformed body), 404 NOT_FOUND (cart), 409 CART_NOT_OPEN
      (cart checked out), 404 COUPON_INVALID (unknown code), 422 COUPON_NOT_VALID_IN_REGION (EU-ONLY
      outside eu). Apply coupons before checkoutCart, which fixes the order's totals.
    adapter: applyCoupon
    tags: [carts]
    oas:
      operationId: applyCoupon
    inputs:
      - name: cartId
        type: string
        description: Open cart from createCart
        default:
          from: createCart.cartId
      - name: code
        type: string
        description: Coupon code (SAVE10, FREESHIP, or EU-ONLY), matched case-insensitively
        default: SAVE10
    outputs:
      - name: couponCode
        type: string
        description: The coupon now on the cart
      - name: discount
        type: integer
        description: Discount in minor units
      - name: discountDisplay
        type: string
        description: The discount formatted for display
    requires: [cartOpen]

  checkoutCart:
    description: >-
      Price a cart and turn it into an order (POST /carts/{cartId}/checkout, 201). The order starts
      created and unpaid, and the cart is no longer open. Its total and currency are what
      paymentCharge must charge, exactly. US adds 8.25% sales tax to the discounted subtotal; EU
      prices include 20% VAT. Errors: 400 VALIDATION_ERROR (shippingTier missing or unknown,
      postalCode missing, deliveryDate neither YYYY-MM-DD nor RFC 3339), 404 NOT_FOUND (cart),
      409 CART_NOT_OPEN,
      409 CART_EMPTY (no lines), 422 TIER_NOT_AVAILABLE (overnight in eu).
    adapter: checkoutCart
    tags: [carts, orders]
    oas:
      operationId: checkoutCart
    inputs:
      - name: cartId
        type: string
        description: Cart to check out, from createCart; it needs at least one line
        default:
          from: createCart.cartId
      - name: shippingTier
        type: enum[standard, express, overnight]
        description: >-
          Required. Costs in minor units: us standard 599, express 1499, overnight 2999; eu standard
          499, express 1299, and no overnight
        default: standard
      - name: postalCode
        type: string
        description: Required delivery postal code; each environment supplies one for its region
        default: "{{env.postalCode}}"
      - name: customerEmail
        type: string
        description: Overrides the cart's customer email on the order; not validated
        optional: true
      - name: deliveryDate
        type: date
        description: Requested delivery date, YYYY-MM-DD (an RFC 3339 timestamp is also accepted)
        optional: true
      - name: notes
        type: string
        description: Free-text delivery notes
        optional: true
    outputs:
      - name: orderId
        type: string
        description: Order ID, such as ord_0001, used by the payment, shipping, cancel, and return calls
        display: Order
      - name: receiptNumber
        type: string
        description: Human-readable receipt number, such as RCPT-US-0001
        display: Receipt
      - name: status
        type: string
        description: created
      - name: currency
        type: string
        description: USD or EUR; paymentCharge must send this currency
      - name: subtotal
        type: integer
        description: Sum of the order lines in minor units
      - name: discount
        type: integer
        description: Coupon discount in minor units
      - name: shipping
        type: integer
        description: Shipping for the tier in minor units, 0 with FREESHIP
      - name: tax
        type: integer
        description: US sales tax added to the total, or EU VAT already included in the prices
      - name: taxLabel
        type: string
        description: Sales tax 8.25% in us, VAT 20% (included) in eu
        display: Tax
      - name: total
        type: integer
        description: >-
          Amount paymentCharge must charge, in minor units: subtotal minus discount plus shipping,
          plus tax in us
      - name: totalDisplay
        type: string
        description: The total formatted for display, such as $130.66
        display: Total
    cleanup: deleteOrder
    requires: [cartPopulated]
    satisfies: [orderCreated]

  deleteCart:
    description: >-
      Delete a cart in any state (DELETE /carts/{cartId}, 204; 404 NOT_FOUND if unknown). The
      cleanup for createCart.
    adapter: deleteCart
    tags: [carts, cleanup]
    oas:
      operationId: deleteCart
    inputs:
      - name: cartId
        type: string
        description: Cart to delete
    outputs: []

  # --- Orders and shipments ------------------------------------------------

  listOrders:
    description: >-
      Page through the region's orders in ID order (GET /orders), limit at a time. Pass a page's
      nextCursor back as after for the next page. A full page gives one even when nothing follows,
      so a listing ends with a page whose nextCursor is "". customerEmail keeps one customer's
      orders. A step with repeat.next reads every page.
    adapter: listOrders
    tags: [orders]
    oas:
      operationId: listOrders
    inputs:
      - name: limit
        type: integer
        description: Orders per page, from 1 to 100
        default: 20
      - name: after
        type: string
        description: The previous page's nextCursor; omit it for the first page
        optional: true
      - name: customerEmail
        type: string
        description: Only list this customer's orders; omit it for every order in the region
        optional: true
    outputs:
      - name: orders
        type: order[]
        description: The page's orders, with orderId, status, paymentStatus, and total
        elementFields:
          - name: orderId
            type: string
          - name: status
            type: string
          - name: paymentStatus
            type: string
          - name: total
            type: integer
      - name: orderCount
        type: integer
        description: Orders on the page
      - name: liveOrderCount
        type: integer
        description: Orders on the page that aren't cancelled
      - name: nextCursor
        type: string
        description: The after cursor for the next page; "" on the last page

  getOrder:
    description: >-
      Read an order with its lines, totals, status, and paymentStatus (GET /orders/{orderId}); an
      unknown order is 404 NOT_FOUND. Use it to confirm the state after a payment, cancellation,
      shipment, return, or refund.
    adapter: getOrder
    tags: [orders]
    oas:
      operationId: getOrder
    inputs:
      - name: orderId
        type: string
        description: Order from checkoutCart
        default:
          from: checkoutCart.orderId
    outputs:
      - name: orderId
        type: string
        description: The order that was read
      - name: status
        type: string
        description: created, paid, shipped, delivered, returned, or cancelled
      - name: paymentStatus
        type: string
        description: unpaid, captured, partially_refunded, or refunded
      - name: total
        type: integer
        description: Order total in minor units
      - name: totalDisplay
        type: string
        description: The total formatted for display
    requires: [orderCreated]

  cancelOrder:
    description: >-
      Cancel an order that is created or paid (POST /orders/{orderId}/cancel, 200). Shipped,
      delivered, returned, and cancelled orders answer 409 INVALID_TRANSITION; an unknown order is
      404 NOT_FOUND. Cancelling does not refund: for a paid order, call paymentRefund as well.
    adapter: cancelOrder
    tags: [orders]
    oas:
      operationId: cancelOrder
    inputs:
      - name: orderId
        type: string
        description: Created or paid order to cancel
        default:
          from: checkoutCart.orderId
    outputs:
      - name: status
        type: string
        description: cancelled
      - name: paymentStatus
        type: string
        description: Unchanged by cancelling; a paid order stays captured until paymentRefund
    requires: [orderCreated]

  shipOrder:
    description: >-
      Ship a paid order (POST /orders/{orderId}/ship, 201; takes about 600 ms) and return the new
      shipment. Any other state answers 409 INVALID_TRANSITION; an unknown order is 404 NOT_FOUND.
      The order is checked again after the delay, so one cancelled or deleted meanwhile answers 409
      or 404 then.
    adapter: shipOrder
    tags: [orders, shipments]
    oas:
      operationId: shipOrder
    inputs:
      - name: orderId
        type: string
        description: Paid order to ship
        default:
          from: checkoutCart.orderId
    outputs:
      - name: shipmentId
        type: string
        description: Shipment ID, such as shp_0001, used by getShipment and deliverShipment
      - name: status
        type: string
        description: in_transit
      - name: orderStatus
        type: string
        description: shipped
      - name: trackingNumber
        type: string
        description: Carrier tracking number
        display: Tracking
      - name: eta
        type: string
        description: Estimated delivery date, YYYY-MM-DD
    requires: [orderPaid]
    satisfies: [orderShipped]

  getShipment:
    description: >-
      Track a shipment (GET /shipments/{shipmentId}). The first two reads of every shipment answer
      503 TRACKING_UNAVAILABLE with a Retry-After header of 1 second while the carrier warms up;
      wait and retry, and the third read returns tracking data. An unknown shipment is
      404 NOT_FOUND.
    adapter: getShipment
    tags: [shipments]
    oas:
      operationId: getShipment
    inputs:
      - name: shipmentId
        type: string
        description: Shipment from shipOrder
        default:
          from: shipOrder.shipmentId
    outputs:
      - name: shipmentId
        type: string
        description: The shipment that was read
      - name: status
        type: string
        description: in_transit, or delivered after deliverShipment
      - name: trackingNumber
        type: string
        description: Carrier tracking number
      - name: eta
        type: string
        description: Estimated delivery date, YYYY-MM-DD
    requires: [orderShipped]

  deliverShipment:
    description: >-
      Mark a shipment delivered (POST /shipments/{shipmentId}/deliver, 200), moving its order from
      shipped to delivered. Errors, in the order they are checked: 404 NOT_FOUND (shipment, or its
      order if that was deleted), 409 INVALID_TRANSITION (order not shipped).
    adapter: deliverShipment
    tags: [shipments]
    oas:
      operationId: deliverShipment
    inputs:
      - name: shipmentId
        type: string
        description: Shipment from shipOrder
        default:
          from: shipOrder.shipmentId
    outputs:
      - name: status
        type: string
        description: delivered
      - name: orderStatus
        type: string
        description: delivered
    requires: [orderShipped]
    satisfies: [orderDelivered]

  createReturn:
    description: >-
      Return a delivered order (POST /orders/{orderId}/returns, 201); the order becomes returned. A
      reason is required (400 VALIDATION_ERROR), an unknown order is 404 NOT_FOUND, and other order
      states answer 409 INVALID_TRANSITION. Returning does not refund: call paymentRefund as well.
    adapter: createReturn
    tags: [orders]
    oas:
      operationId: createReturn
    inputs:
      - name: orderId
        type: string
        description: Delivered order to return
        default:
          from: checkoutCart.orderId
      - name: reason
        type: string
        description: Why the customer returns the order; required
        default: Did not fit
    outputs:
      - name: returnId
        type: string
        description: Return ID, such as ret_0001
      - name: rmaNumber
        type: string
        description: Return authorization number, such as RMA-US-0001
        display: RMA
      - name: orderStatus
        type: string
        description: returned
    requires: [orderDelivered]

  deleteOrder:
    description: >-
      Delete an order in any state (DELETE /orders/{orderId}, 204; 404 NOT_FOUND if unknown). The
      cleanup for checkoutCart.
    adapter: deleteOrder
    tags: [orders, cleanup]
    oas:
      operationId: deleteOrder
    inputs:
      - name: orderId
        type: string
        description: Order to delete
    outputs: []

  # --- Payments (separate host and credential; see env.yaml overrides) ------

  paymentCharge:
    description: >-
      Charge an order on the payments API (POST /payments/charges, 201; takes about 350 ms). This
      call goes to the payments host with the X-API-Key header, not to the shop API with the bearer
      token. The order must be created and not yet paid, and amount and currency must equal the
      order's total and currency; on success the order becomes paid. Errors, in the order they are
      checked: 400 VALIDATION_ERROR (orderId missing, amount not a positive integer, currency
      missing, method missing or unknown, or the method's companion field missing), 404 NOT_FOUND
      (order), 422 CURRENCY_MISMATCH, 422 AMOUNT_MISMATCH, 409 INVALID_TRANSITION (order not
      created), then, after the gateway delay, 402 CARD_DECLINED, 404 GIFT_CARD_INVALID, or 402
      INSUFFICIENT_FUNDS. The order is checked again after the delay: 404 NOT_FOUND if it was deleted
      meanwhile, 409 INVALID_TRANSITION if it was cancelled or paid by another request. If a charge's
      response is lost, read the order with getOrder before charging again.
    adapter: paymentCharge
    tags: [payments]
    oas:
      operationId: paymentCharge
    inputs:
      - name: orderId
        type: string
        description: Order to pay, from checkoutCart
        default:
          from: checkoutCart.orderId
      - name: amount
        type: integer
        description: The order's total in minor units, exactly (422 AMOUNT_MISMATCH otherwise)
        default:
          from: checkoutCart.total
      - name: currency
        type: string
        description: The order's currency in upper case, USD or EUR (422 CURRENCY_MISMATCH otherwise)
        default:
          from: checkoutCart.currency
      - name: method
        type: enum[card, gift_card, paypal]
        description: >-
          How to pay, required (400 VALIDATION_ERROR when missing or unknown); decides which one of
          cardNumber, giftCardCode, or paypalEmail is required
        default: card
      - name: cardNumber
        type: string
        description: >-
          Required for method card. 4000000000000002 is declined (402 CARD_DECLINED); any other
          number, such as 4242424242424242 or 378282246310005, is approved
        optional: true
        default: "4242424242424242"
      - name: giftCardCode
        type: string
        description: >-
          Required for method gift_card. Balances in minor units: GC-10-DEMO 1000, GC-100-DEMO
          10000, GC-500-DEMO 50000; a balance below the amount is 402 INSUFFICIENT_FUNDS
        optional: true
      - name: paypalEmail
        type: string
        description: Required for method paypal
        optional: true
    outputs:
      - name: paymentId
        type: string
        description: Payment ID, such as pay_0001
      - name: status
        type: string
        description: captured
      - name: orderStatus
        type: string
        description: paid
      - name: amountDisplay
        type: string
        description: The charged amount formatted for display
        display: Charged
    requires: [orderCreated]
    satisfies: [orderPaid]

  paymentRefund:
    description: >-
      Refund an order's payment on the payments API (POST /payments/refunds, 201), with the X-API-Key
      header like paymentCharge. Refunds are keyed by orderId and work in any order state while
      captured money remains, including cancelled and returned orders. Omit amount to refund the
      remaining balance; a partial refund leaves the payment partially_refunded. Errors: 400
      VALIDATION_ERROR (orderId missing, amount below 1), 404 NOT_FOUND (order), 409
      PAYMENT_NOT_REFUNDABLE (never paid, or already fully refunded), 422 AMOUNT_MISMATCH (more than
      the remaining balance).
    adapter: paymentRefund
    tags: [payments]
    oas:
      operationId: paymentRefund
    inputs:
      - name: orderId
        type: string
        description: Order whose payment to refund
        default:
          from: checkoutCart.orderId
      - name: amount
        type: integer
        description: Minor units; omit it to refund the whole remaining balance
        optional: true
    outputs:
      - name: refundId
        type: string
        description: Refund ID, such as ref_0001
      - name: amount
        type: integer
        description: Refunded amount in minor units
      - name: amountDisplay
        type: string
        description: The refunded amount formatted for display
        display: Refunded
    requires: [orderPaid]

workflows:
  # --- Base workflows ------------------------------------------------------

  - name: Quick Purchase
    description: Browse, add the first in-stock product to a guest cart, check out, and pay by card
    template: workflows/quick-purchase.yaml
    selectionHint: The shortest end-to-end purchase; ends at payment, so payment negative tests fit here

  - name: Checkout
    description: Buy as a guest or registered customer, pay by card, gift card, or PayPal, and ship
    template: workflows/checkout.yaml
    selectionHint: Use when the customer type or payment method matters, or with coupon, tracking, or return addons
    slots:
      - name: customer
        description: Who is buying
        options: [Guest, Registered]
        default: Guest
      - name: payment
        description: How the order is paid
        options: [Card, Gift Card, PayPal]
        default: Card

  # --- Slot options --------------------------------------------------------

  - name: Guest
    kind: slot
    description: A guest cart with no customer email
    template: workflows/slots/customer-cart.yaml

  - name: Registered
    kind: slot
    description: A registered customer's cart; the email is injected into every step that accepts it
    template: workflows/slots/customer-cart.yaml
    inject:
      customerEmail: demo@example.com

  - name: Card
    kind: slot
    description: Pay by card (the number comes from the graph default or a card layer)
    template: workflows/slots/payment-card.yaml

  - name: Gift Card
    kind: slot
    description: Pay with the $500 demo gift card
    template: workflows/slots/payment-gift-card.yaml

  - name: PayPal
    kind: slot
    description: Pay with PayPal
    template: workflows/slots/payment-paypal.yaml

  # --- Addons --------------------------------------------------------------

  - name: Inventory Check
    kind: addon
    description: Check stock for the rain shell after browsing, retrying its stale first read
    template: workflows/addons/inventory-check.yaml
    after: listProducts

  - name: Apply Coupon
    kind: addon
    description: Apply a coupon (SAVE10 unless a coupon layer picks another) after adding items
    template: workflows/addons/apply-coupon.yaml
    after: addItem

  - name: Track Shipment
    kind: addon
    description: Track the shipment after it ships, retrying while the carrier warms up
    template: workflows/addons/track-shipment.yaml
    after: shipOrder

  - name: Return After Delivery
    kind: addon
    description: Deliver the shipment, return the order, and refund the payment
    template: workflows/addons/return-after-delivery.yaml
    after: shipOrder
    priority: 90
