version: 2

project_name: aat

builds:
  - id: aat
    main: ./cmd/aat/
    binary: aat
    env: &build_env
      - CGO_ENABLED=0
    ldflags: &build_ldflags
      - -s -w
      - -X github.com/gburgyan/aat/internal/version.Version={{.Version}}
      - -X github.com/gburgyan/aat/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/gburgyan/aat/internal/version.BuildDate={{.Date}}
    goos: &build_goos
      - linux
      - darwin
      - windows
    goarch: &build_goarch
      - amd64
      - arm64

  # The offline demo API behind examples/shop. `aat-sandbox init` extracts the
  # project from the binary, so the archives carry no copy of it.
  - id: aat-sandbox
    main: ./cmd/aat-sandbox/
    binary: aat-sandbox
    env: *build_env
    ldflags: *build_ldflags
    goos: *build_goos
    goarch: *build_goarch

archives:
  - id: default
    ids: [aat, aat-sandbox]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Versionless names give stable URLs:
    #   https://github.com/gburgyan/aat/releases/latest/download/aat_darwin_arm64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# The release workflow passes the tag's CHANGELOG.md section with --release-notes,
# which skips this generated changelog; only local and snapshot runs use it.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Homebrew cask pushed to github.com/gburgyan/homebrew-tap (Casks/aat.rb).
# Requires the HOMEBREW_TAP_GITHUB_TOKEN secret (fine-grained PAT, Contents RW on the tap repo).
# Documented as macOS-only: the generated cask also carries on_linux stanzas, but Linuxbrew
# installs are unverified until the v0.1.0 release (M5). Linux users install from the release
# archives, Docker, or `go install`.
homebrew_casks:
  - name: aat
    repository:
      owner: gburgyan
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://gburgyan.github.io/aat/
    description: "Model your API as a graph; run long-chain tests, layer matrices, and an MCP server from it"
    license: Apache-2.0
    # aat-sandbox ships alongside so the offline quick start works right after install.
    binaries: [aat, aat-sandbox]
    # The binaries are not notarized; strip the quarantine attribute so the
    # first run does not trip Gatekeeper.
    hooks:
      post:
        install: |
          if OS.mac?
            %w[aat aat-sandbox].each do |binary|
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/#{binary}"]
            end
          end

# Multi-arch image at ghcr.io/gburgyan/aat (see Dockerfile), aat only. Images are
# built and pushed in the publish phase; `--snapshot` builds them locally.
dockers_v2:
  - id: aat
    ids: [aat]
    dockerfile: Dockerfile
    images:
      - ghcr.io/gburgyan/aat
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/gburgyan/aat"
      "org.opencontainers.image.licenses": "Apache-2.0"
      "org.opencontainers.image.description": "Model your API as a graph; run long-chain tests, layer matrices, and an MCP server from it"

release:
  footer: |
    ## Install

    - Homebrew (macOS): `brew install gburgyan/tap/aat` (installs `aat` and `aat-sandbox`)
    - Docker: `docker run --rm ghcr.io/gburgyan/aat:{{ .Version }} --version`
    - Binaries: download the archive for your platform above and verify with `checksums.txt`

    ## Try it offline

    `aat-sandbox init shop && cd shop`, start `aat-sandbox serve` in another terminal, then `aat run plan full-lifecycle`.
