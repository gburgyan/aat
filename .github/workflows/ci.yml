name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      - name: Build frontend
        working-directory: server/web
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: server/web/dist/app/
          retention-days: 1

  test:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: server/web/dist/app/

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | grep ^total: | awk '{print $3}')
          echo "### Test Coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.9.0"

  example-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # No frontend artifact: the job never starts `aat web`, and the tracked
      # server/web/dist/placeholder.txt satisfies the embed.
      - name: Run examples/shop against the sandbox
        run: make example-shop

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: example-shop-runs
          path: examples/shop/_output/
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: server/web/dist/app/

      - name: Build binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags "\
            -s -w \
            -X github.com/gburgyan/aat/internal/version.Version=${VERSION} \
            -X github.com/gburgyan/aat/internal/version.GitCommit=${COMMIT} \
            -X github.com/gburgyan/aat/internal/version.BuildDate=${DATE}" \
            -o aat_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/aat/

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./aat_linux_amd64 --version

      - uses: actions/upload-artifact@v7
        with:
          name: aat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: aat_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
          retention-days: 7
