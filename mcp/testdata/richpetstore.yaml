openapi: "3.0.3"
info:
  title: Rich Pet Store
  version: "1.0.0"
  description: A rich petstore API for testing OAS tools

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags: [Pets]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: Create a new pet
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetRequest"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by ID
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A single pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

    put:
      operationId: updatePet
      summary: Update an existing pet
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePetRequest"
      responses:
        "200":
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [Pets]
      deprecated: true
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pet deleted

  /categories:
    get:
      operationId: listCategories
      summary: List pet categories
      tags: [Categories]
      responses:
        "200":
          description: A list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

components:
  schemas:
    BaseEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - id

    Address:
      type: object
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          pattern: "^[A-Z]{2}$"
        zipCode:
          type: string
          pattern: "^\\d{5}(-\\d{4})?$"
      required:
        - street
        - city

    Pet:
      description: A pet in the store
      allOf:
        - $ref: "#/components/schemas/BaseEntity"
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
              description: The pet's name
            status:
              type: string
              enum: [available, pending, sold]
              description: Availability status
            species:
              type: string
              description: The species of the pet
            age:
              type: integer
              minimum: 0
              maximum: 200
              description: Age in years
            address:
              $ref: "#/components/schemas/Address"
            tags:
              type: array
              items:
                type: string
              description: Tags for categorization
          required:
            - name
            - status

    CreatePetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The pet's name
        species:
          type: string
          description: The species of the pet
        status:
          type: string
          enum: [available, pending, sold]
          description: Initial availability status
        age:
          type: integer
          minimum: 0
          maximum: 200
          description: Age in years
        address:
          $ref: "#/components/schemas/Address"
        tags:
          type: array
          items:
            type: string
      required:
        - name
        - species

    UpdatePetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum: [available, pending, sold]
        age:
          type: integer
          minimum: 0
          maximum: 200

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        parentId:
          type: string
          format: uuid
          description: Parent category ID for nesting
      required:
        - id
        - name

    TreeNode:
      type: object
      description: A self-referencing tree structure
      properties:
        value:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
      required:
        - value

    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        message:
          type: string
          description: Error message
      required:
        - code
        - message

    Animal:
      type: object
      description: Base type for all animals
      discriminator:
        propertyName: animalType
        mapping:
          dog: "#/components/schemas/Dog"
          cat: "#/components/schemas/Cat"
      oneOf:
        - $ref: "#/components/schemas/Dog"
        - $ref: "#/components/schemas/Cat"
      properties:
        animalType:
          type: string
          description: Discriminator property
        sound:
          type: string
      required:
        - animalType

    Dog:
      description: A dog
      allOf:
        - $ref: "#/components/schemas/Animal"
        - type: object
          properties:
            breed:
              type: string
              description: Dog breed
          required:
            - breed

    Cat:
      description: A cat
      allOf:
        - $ref: "#/components/schemas/Animal"
        - type: object
          properties:
            indoor:
              type: boolean
              description: Whether the cat is indoor-only
