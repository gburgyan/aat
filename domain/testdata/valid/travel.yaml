concepts:
  domestic:
    description: "A flight where origin and destination are within the same country"
    applies_to: [origin, destination]
    constraint: "origin and destination must be in the same country"
    examples:
      US: ["JFK-LAX", "ORD-SFO", "ATL-DFW"]
      UK: ["LHR-MAN", "EDI-LGW"]

  international:
    description: "A flight where origin and destination are in different countries"
    applies_to: [origin, destination]
    constraint: "origin and destination must be in different countries"
    examples:
      transatlantic: ["JFK-LHR", "ORD-CDG"]
      transpacific: ["LAX-NRT", "SFO-HKG"]

  roundTrip:
    description: "A journey with outbound and return segments"
    applies_to: [tripType]
    constraint: "requires both departure and return dates"

  oneWay:
    description: "A journey with only an outbound segment"
    applies_to: [tripType]
    constraint: "requires only a departure date"

  directFlight:
    description: "A flight with no intermediate stops or connections"
    applies_to: [connectionType]
    constraint: "maxConnections must be 0"

  economy:
    description: "Standard cabin class with basic service"
    applies_to: [cabin]
    constraint: "cabin must be Economy or PremiumEconomy"

  business:
    description: "Premium cabin class with enhanced service"
    applies_to: [cabin]
    constraint: "cabin must be Business or First"

  adultTraveler:
    description: "A passenger aged 12 or older"
    applies_to: [passengerType, age]
    constraint: "passengerTypeCode must be ADT"

  childTraveler:
    description: "A passenger aged 2-11"
    applies_to: [passengerType, age]
    constraint: "passengerTypeCode must be CNN"

  futureDeparture:
    description: "Departure date must be in the future relative to search time"
    applies_to: [departureDate, returnDate]
    constraint: "date must be after current date"

  shortHaul:
    description: "A flight under 3 hours duration"
    applies_to: [origin, destination, duration]
    constraint: "total flight time under 180 minutes"

  longHaul:
    description: "A flight over 6 hours duration"
    applies_to: [origin, destination, duration]
    constraint: "total flight time over 360 minutes"

  multiPassenger:
    description: "A booking with more than one traveler"
    applies_to: [passengerCount, travelers]
    constraint: "at least 2 passengers in the booking"

types:
  airportCode:
    description: "IATA 3-letter airport code"
    format: "3 uppercase letters"
    validation: "^[A-Z]{3}$"
    pool: usAirports

  passengerTypeCode:
    description: "ATPCO passenger type code"
    format: "3 uppercase letters"
    validation: "^[A-Z]{3}$"

  traveler:
    description: "A person traveling on the booking"
    format: "composite"
    fields:
      given:
        type: string
        description: "First/given name"
        strategy: "generate realistic name"
      surname:
        type: string
        description: "Last/family name"
        strategy: "generate realistic name"
      passengerTypeCode:
        type: passengerTypeCode
        description: "ATPCO passenger type (ADT, CNN, INF)"
        constraint: "must match traveler age"
      gender:
        type: string
        description: "Gender (Male, Female)"
        constraint: "must be Male or Female"

  cabinClass:
    description: "Aircraft cabin class"
    format: "one of Economy, PremiumEconomy, Business, First"
    pool: cabinClasses

  pnrLocator:
    description: "Passenger Name Record locator code"
    format: "6 alphanumeric characters"
    validation: "^[A-Z0-9]{6}$"

  currencyCode:
    description: "ISO 4217 currency code"
    format: "3 uppercase letters"
    validation: "^[A-Z]{3}$"
    pool: currencies

