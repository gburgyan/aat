version: "1.0.0"

nodes:
  source:
    description: "Primary data source"
    adapter: source
    satisfies: [dataReady]
    inputs: []
    outputs:
      - name: data
        type: string

  transform:
    description: "Transform data (longer path)"
    adapter: transform
    requires: [dataReady]
    satisfies: [resultReady]
    inputs:
      - name: data
        type: string
    outputs:
      - name: result
        type: string

  shortcut:
    description: "Direct shortcut (shorter path)"
    adapter: shortcut
    satisfies: [resultReady]
    inputs: []
    outputs:
      - name: result
        type: string

  preferredSource:
    description: "Preferred path source"
    adapter: preferredSource
    preferred: true
    requires: [dataReady]
    satisfies: [resultReady]
    inputs:
      - name: data
        type: string
    outputs:
      - name: result
        type: string

  consumer:
    description: "Consumes result from one of the paths"
    adapter: consumer
    requires: [resultReady]
    inputs:
      - name: result
        type: string
    outputs:
      - name: output
        type: string
