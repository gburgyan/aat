version: "1.0.0"

nodes:
  searchFlights:
    description: "Search for available flights via Travelport catalog"
    adapter: travelport.searchFlights
    satisfies: [flightsSearched]
    inputs:
      - name: origin
        type: string
        description: "Departure airport IATA code"
      - name: destination
        type: string
        description: "Arrival airport IATA code"
      - name: departureDate
        type: date
        description: "Outbound departure date"
      - name: returnDate
        type: date
        description: "Return date for round-trip"
        optional: true
      - name: passengers
        type: integer
        description: "Number of passengers"
        optional: true
        default: 1
      - name: cabinPreference
        type: enum[economy, premiumEconomy, business, first]
        description: "Preferred cabin class"
        optional: true
        default: economy
    outputs:
      - name: catalogOfferings
        type: offering[]
        description: "List of available flight offerings"
        elementFields:
          - name: offeringId
            type: string
            path: "id"
          - name: departure
            type: string
          - name: arrival
            type: string
          - name: departureTime
            type: datetime
          - name: arrivalTime
            type: datetime
          - name: carrier
            type: string
          - name: stops
            type: integer
          - name: cabin
            type: string
          - name: productRef
            type: string
            path: "ProductBrandOptions.0.ProductBrandOffering.0.Product.0.productRef"
      - name: catalogOfferingsId
        type: string
        description: "Catalog offerings session identifier"

  priceOffer:
    description: "Confirm pricing on a selected catalog offering"
    adapter: travelport.priceOffer
    requires: [flightsSearched]
    inputs:
      - name: catalogOfferingsId
        type: string
        description: "Catalog offerings session identifier"
      - name: offeringId
        type: string
        description: "Selected catalog product offering reference (e.g. o1)"
      - name: productRef
        type: string
        description: "Selected product reference within the offering (e.g. p0)"
    outputs:
      - name: offerListId
        type: string
        description: "OfferList identifier from price response (GUID for BuildFromOfferList)"
      - name: offerId
        type: string
        description: "Offer identifier from price response"
      - name: totalPrice
        type: money
        description: "Confirmed total price"
      - name: currencyCode
        type: string
        description: "Currency of the price"

  createWorkbench:
    description: "Create a reservation workbench (booking session)"
    adapter: travelport.createWorkbench
    satisfies: [workbenchCreated]
    inputs: []
    outputs:
      - name: workbenchId
        type: string
        description: "Reservation workbench identifier"
    cleanup: ignoreWorkbench

  addOffer:
    description: "Add an offer to the reservation workbench via BuildFromCatalogProductOfferings"
    adapter: travelport.addOffer
    requires: [flightsSearched, workbenchCreated]
    satisfies: [offerAdded]
    inputs:
      - name: workbenchId
        type: string
        description: "Reservation workbench identifier"
      - name: catalogOfferingsId
        type: string
        description: "Catalog offerings session identifier from search"
      - name: offeringId
        type: string
        description: "Selected catalog product offering reference (e.g. o1)"
      - name: productRef
        type: string
        description: "Selected product reference within the offering (e.g. p0)"
    outputs:
      - name: offerStatus
        type: string
        description: "Offer identifier confirming offer was added"

  addTraveler:
    description: "Add passenger details to the reservation workbench"
    adapter: travelport.addTraveler
    requires: [workbenchCreated]
    satisfies: [travelerAdded]
    inputs:
      - name: workbenchId
        type: string
        description: "Reservation workbench identifier"
      - name: surname
        type: string
        description: "Traveler last name"
      - name: givenName
        type: string
        description: "Traveler first name"
      - name: birthDate
        type: date
        description: "Traveler date of birth"
      - name: gender
        type: enum[Male, Female, Undisclosed]
        description: "Traveler gender"
      - name: passengerTypeCode
        type: string
        description: "Passenger type code (e.g. ADT, CHD, INF)"
        optional: true
        default: ADT
    outputs:
      - name: travelerId
        type: string
        description: "Assigned traveler identifier"

  commitBooking:
    description: "Finalize the reservation to create a PNR"
    adapter: travelport.commitBooking
    requires: [offerAdded, travelerAdded]
    inputs:
      - name: workbenchId
        type: string
        description: "Reservation workbench identifier"
      - name: offerStatus
        type: string
        description: "Offer identifier confirming offer was added"
      - name: travelerId
        type: string
        description: "Traveler identifier confirming traveler was added"
    outputs:
      - name: locator
        type: string
        description: "PNR record locator"
      - name: locatorSource
        type: string
        description: "Source system of the PNR locator (e.g. 1G, UA)"

  ignoreWorkbench:
    description: "Discard the reservation workbench (cleanup)"
    adapter: travelport.ignoreWorkbench
    inputs:
      - name: workbenchId
        type: string
        description: "Reservation workbench identifier"
    outputs:
      - name: acknowledged
        type: boolean
        description: "Whether the workbench was successfully discarded"
