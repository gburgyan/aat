version: "1.0.0"

nodes:
  authenticate:
    description: "Authenticate with the API"
    adapter: auth.authenticate
    cycleBreaker: true
    satisfies: [authenticated]
    inputs:
      - name: clientId
        type: string
      - name: clientSecret
        type: string
    outputs:
      - name: token
        type: string

  refreshToken:
    description: "Refresh an expired token"
    adapter: auth.refreshToken
    requires: [authenticated]
    satisfies: [authenticated]
    inputs:
      - name: token
        type: string
    outputs:
      - name: token
        type: string

  getUser:
    description: "Get user details"
    adapter: api.getUser
    requires: [authenticated]
    satisfies: [userRetrieved]
    inputs:
      - name: token
        type: string
      - name: userId
        type: string
    outputs:
      - name: name
        type: string
      - name: email
        type: string

  updateUser:
    description: "Update user details"
    adapter: api.updateUser
    requires: [authenticated, userRetrieved]
    inputs:
      - name: token
        type: string
      - name: userId
        type: string
      - name: name
        type: string
    outputs:
      - name: updated
        type: boolean
