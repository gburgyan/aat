version: "1.0.0"

nodes:
  stepA:
    description: "Step A"
    adapter: stepA
    inputs:
      - name: input1
        type: string
    outputs:
      - name: output1
        type: string

  stepB:
    description: "Step B"
    adapter: stepB
    inputs:
      - name: input1
        type: string
    outputs:
      - name: output1
        type: string

  stepC:
    description: "Step C"
    adapter: stepC
    inputs:
      - name: input1
        type: string
    outputs:
      - name: output1
        type: string

edges:
  - from: stepA.output1
    to: stepB.input1
  - from: stepB.output1
    to: stepC.input1

conditions:
  - when: "flag.premium == true"
    require: [stepB]
  - when: "flag.express == true"
    before: [stepA]
