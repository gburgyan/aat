version: "1.0.0"

workflows:
  - name: Good Workflow
    description: "A workflow with a valid template"
    template: plans/good-template.yaml
  - name: Wired Workflow
    description: "A standalone base whose input composition wires with AUTOWIRE"
    template: plans/wired-template.yaml

nodes:
  producerNode:
    description: "Produces the value testNode takes"
    adapter: test.producer
    outputs:
      - name: input1
        type: string
  testNode:
    description: "A simple test node"
    adapter: test.adapter
    inputs:
      - name: input1
        type: string
    outputs:
      - name: output1
        type: string
